<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria Milktea Shop - Pixel Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background: #87CEEB;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stats-panel {
            background: #2c3e50;
            border: 4px solid #34495e;
            padding: 15px;
            color: #fff;
            font-size: 12px;
            pointer-events: all;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            color: #f39c12;
        }

        .stat-value {
            color: #2ecc71;
            font-weight: bold;
        }

        .instruction-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            border: 4px solid #34495e;
            padding: 20px 30px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            pointer-events: all;
            max-width: 600px;
            line-height: 1.8;
        }

        .ingredient-name {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 10px;
            pointer-events: none;
            white-space: nowrap;
            z-index: 1000;
        }

        .action-button {
            background: #2ecc71;
            border: 4px solid #27ae60;
            color: #fff;
            padding: 15px 30px;
            font-size: 12px;
            cursor: pointer;
            margin: 10px;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 0 4px 0 #229954;
            transition: all 0.1s;
        }

        .action-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #229954;
        }

        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #229954;
        }

        .action-button.disabled {
            background: #95a5a6;
            border-color: #7f8c8d;
            box-shadow: 0 4px 0 #7f8c8d;
            cursor: not-allowed;
        }

        #thoughtBubble {
            position: absolute;
            background: white;
            border: 4px solid #2c3e50;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 11px;
            color: #2c3e50;
            max-width: 250px;
            line-height: 1.6;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        #thoughtBubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 30px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
        }

        #thoughtBubble::before {
            content: '';
            position: absolute;
            bottom: -24px;
            left: 28px;
            width: 0;
            height: 0;
            border-left: 17px solid transparent;
            border-right: 17px solid transparent;
            border-top: 24px solid #2c3e50;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c3e50;
            border: 8px solid #34495e;
            padding: 40px;
            color: #fff;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal-content p {
            margin: 15px 0;
            font-size: 11px;
            line-height: 1.8;
        }

        .score-display {
            font-size: 48px;
            margin: 20px 0;
        }

        .buttons-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-overlay">
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">💰 Money:</span>
                    <span class="stat-value" id="money">$100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⭐ Rep:</span>
                    <span class="stat-value" id="reputation">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📅 Day:</span>
                    <span class="stat-value" id="day">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🎯 Served:</span>
                    <span class="stat-value" id="served">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="1200" height="700"></canvas>

        <div class="buttons-container">
            <button class="action-button" id="serveBtn" onclick="serveDrink()">
                🎯 SERVE DRINK
            </button>
            <button class="action-button" id="resetBtn" onclick="resetDrink()">
                🔄 RESET
            </button>
        </div>

        <div class="instruction-panel">
            <strong>HOW TO PLAY:</strong><br>
            Click on ingredients to add to cup → Shake the cup → Serve to customer!<br>
            Match customer orders shown in thought bubble for tips!
        </div>

        <div id="thoughtBubble"></div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>ORDER COMPLETE!</h2>
            <div class="score-display" id="scoreEmoji">😊</div>
            <p id="feedbackText">Great job!</p>
            <p id="earningsText">Earned: $0</p>
            <button class="action-button" onclick="closeResultModal()">CONTINUE</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
