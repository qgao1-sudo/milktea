<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria Milktea Shop - Standalone Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background: #87CEEB;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stats-panel {
            background: #2c3e50;
            border: 4px solid #34495e;
            padding: 15px;
            color: #fff;
            font-size: 12px;
            pointer-events: all;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            color: #f39c12;
        }

        .stat-value {
            color: #2ecc71;
            font-weight: bold;
        }

        .instruction-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            border: 4px solid #34495e;
            padding: 20px 30px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            pointer-events: all;
            max-width: 600px;
            line-height: 1.8;
        }

        #thoughtBubble {
            position: absolute;
            background: white;
            border: 4px solid #2c3e50;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 11px;
            color: #2c3e50;
            max-width: 250px;
            line-height: 1.6;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        #thoughtBubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 30px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
        }

        .action-button {
            background: #2ecc71;
            border: 4px solid #27ae60;
            color: #fff;
            padding: 15px 30px;
            font-size: 12px;
            cursor: pointer;
            margin: 10px;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 0 4px 0 #229954;
            transition: all 0.1s;
        }

        .action-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #229954;
        }

        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #229954;
        }

        .buttons-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c3e50;
            border: 8px solid #34495e;
            padding: 40px;
            color: #fff;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal-content p {
            margin: 15px 0;
            font-size: 11px;
            line-height: 1.8;
        }

        .score-display {
            font-size: 48px;
            margin: 20px 0;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-overlay">
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">💰 Money:</span>
                    <span class="stat-value" id="money">$100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⭐ Rep:</span>
                    <span class="stat-value" id="reputation">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📅 Day:</span>
                    <span class="stat-value" id="day">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🎯 Served:</span>
                    <span class="stat-value" id="served">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="1200" height="700"></canvas>

        <div class="buttons-container">
            <button class="action-button" id="serveBtn" onclick="serveDrink()">
                🎯 SERVE DRINK
            </button>
            <button class="action-button" id="resetBtn" onclick="resetDrink()">
                🔄 RESET
            </button>
        </div>

        <div class="instruction-panel">
            <strong>HOW TO PLAY:</strong><br>
            Click on ingredient jars to add to cup → Click cup to shake → Serve to customer!<br>
            Match customer orders shown in thought bubble for tips!<br>
            <small style="opacity: 0.5;">v3.0 - Standalone Version (No Server Required!)</small>
        </div>

        <div id="thoughtBubble"></div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>ORDER COMPLETE!</h2>
            <div class="score-display" id="scoreEmoji">😊</div>
            <p id="feedbackText">Great job!</p>
            <p id="earningsText">Earned: $0</p>
            <button class="action-button" onclick="closeResultModal()">CONTINUE</button>
        </div>
    </div>

    <script>
// Game code embedded directly
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const game = {
    money: 100,
    reputation: 0,
    day: 1,
    served: 0,
    currentCustomer: null,
    currentDrink: { base: null, milk: null, toppings: [], shaken: false },
    ingredients: [],
    animations: []
};

const customers = [
    { name: "Sarah", sprite: "👩", color: "#FFB6C1", order: { text: "I want milk tea with pearls!", base: "black-tea", milk: "fresh-milk", toppings: ["pearl"] } },
    { name: "Mike", sprite: "👨", color: "#87CEEB", order: { text: "Green tea with oat milk please!", base: "green-tea", milk: "oat-milk", toppings: [] } },
    { name: "Emma", sprite: "👧", color: "#FFD700", order: { text: "Something fruity and sweet!", base: "jasmine-tea", milk: "fresh-milk", toppings: ["fruit"] } },
    { name: "Lisa", sprite: "👱‍♀️", color: "#FF69B4", order: { text: "Classic milk tea, extra pearls!", base: "black-tea", milk: "fresh-milk", toppings: ["pearl", "pearl"] } }
];

const ingredientDB = {
    "black-tea": { name: "Black Tea", color: "#8B4513", emoji: "🍵", x: 200, y: 320, type: "base" },
    "green-tea": { name: "Green Tea", color: "#90EE90", emoji: "🍃", x: 320, y: 320, type: "base" },
    "jasmine-tea": { name: "Jasmine Tea", color: "#F0E68C", emoji: "🌸", x: 440, y: 320, type: "base" },
    "fresh-milk": { name: "Fresh Milk", color: "#FFFFFF", emoji: "🥛", x: 200, y: 410, type: "milk" },
    "oat-milk": { name: "Oat Milk", color: "#F5DEB3", emoji: "🌾", x: 320, y: 410, type: "milk" },
    "pearl": { name: "Pearls", color: "#000000", emoji: "⚫", x: 200, y: 500, type: "topping" },
    "fruit": { name: "Fruit", color: "#FF69B4", emoji: "🍓", x: 320, y: 500, type: "topping" }
};

for (let key in ingredientDB) {
    game.ingredients.push({ id: key, ...ingredientDB[key], width: 60, height: 60 });
}

class Animation {
    constructor(emoji, startX, startY, endX, endY) {
        this.emoji = emoji; this.startX = startX; this.startY = startY; this.endX = endX; this.endY = endY;
        this.frame = 0; this.maxFrame = 20;
    }
    update() { this.frame++; return this.frame >= this.maxFrame; }
    draw() {
        const progress = this.frame / this.maxFrame;
        const currentX = this.startX + (this.endX - this.startX) * progress;
        const currentY = this.startY + (this.endY - this.startY) * progress - Math.sin(progress * Math.PI) * 50;
        ctx.save(); ctx.globalAlpha = 1 - progress * 0.5; ctx.font = '32px Arial'; ctx.fillText(this.emoji, currentX, currentY); ctx.restore();
    }
}

function drawBackground() {
    // Wall gradient background
    const wallGradient = ctx.createLinearGradient(0, 0, 0, 500);
    wallGradient.addColorStop(0, '#FFE5CC');
    wallGradient.addColorStop(1, '#FFD4A3');
    ctx.fillStyle = wallGradient;
    ctx.fillRect(0, 0, 1200, 500);

    // Menu board on left wall
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(50, 80, 250, 200);
    ctx.fillStyle = '#f39c12';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('🧋 MENU', 100, 120);
    ctx.fillStyle = '#fff';
    ctx.font = '16px Arial';
    ctx.fillText('Milk Tea ..... $4.5', 70, 160);
    ctx.fillText('Fruit Tea .... $5.0', 70, 190);
    ctx.fillText('Special ..... $6.0', 70, 220);
}

function drawFloor() {
    const floorPattern = ctx.createLinearGradient(0, 500, 0, 700);
    floorPattern.addColorStop(0, '#E8D5B7'); floorPattern.addColorStop(1, '#C4A77D');
    ctx.fillStyle = floorPattern; ctx.fillRect(0, 500, 1200, 200);
}

function drawCounter() {
    // Large work table in center
    ctx.fillStyle = '#D2691E';
    ctx.fillRect(150, 300, 900, 280);
    // Table edge highlight
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(150, 300, 900, 15);
    // Table shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(155, 585, 890, 10);
    // Table legs
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(180, 580, 40, 70);
    ctx.fillRect(1000, 580, 40, 70);
}

function drawCustomer() {
    if (!game.currentCustomer) return;
    // Customer positioned behind the table - larger size
    const x = 600, y = 180;
    // Body
    ctx.fillStyle = game.currentCustomer.color;
    ctx.fillRect(x - 50, y + 60, 100, 150);
    // Head
    ctx.beginPath();
    ctx.arc(x, y, 55, 0, Math.PI * 2);
    ctx.fill();
    // Face sprite - much larger
    ctx.font = '80px Arial';
    ctx.fillText(game.currentCustomer.sprite, x - 40, y + 25);
    // Name label
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 20px Arial';
    ctx.fillText(game.currentCustomer.name, x - ctx.measureText(game.currentCustomer.name).width / 2, y + 235);
}

function drawDrinkCup() {
    // Cup positioned on the right side of the table
    const x = 700, y = 370;
    // Cup body
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, y, 80, 120);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 80, 120);
    // Lid
    ctx.fillStyle = '#FF69B4';
    ctx.beginPath();
    ctx.arc(x + 40, y, 45, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Straw
    ctx.strokeStyle = '#FF0000';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(x + 40, y - 50);
    ctx.lineTo(x + 40, y + 20);
    ctx.stroke();
    // Drink layers
    let layerY = y + 110;
    if (game.currentDrink.toppings.length > 0) {
        game.currentDrink.toppings.forEach((topping, i) => {
            ctx.fillStyle = ingredientDB[topping].color;
            ctx.fillRect(x + 5, layerY - i * 15, 70, 15);
        });
        layerY -= game.currentDrink.toppings.length * 15;
    }
    if (game.currentDrink.milk) {
        ctx.fillStyle = ingredientDB[game.currentDrink.milk].color;
        ctx.fillRect(x + 5, layerY - 25, 70, 25);
        layerY -= 25;
    }
    if (game.currentDrink.base) {
        ctx.fillStyle = ingredientDB[game.currentDrink.base].color;
        ctx.fillRect(x + 5, layerY - 25, 70, 25);
    }
    if (game.currentDrink.shaken) {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('✓ SHAKEN', x - 10, y + 150);
    }
}

function drawIngredients() {
    game.ingredients.forEach(ing => {
        const jarX = ing.x, jarY = ing.y, jarWidth = ing.width, jarHeight = ing.height + 20;
        const gradient = ctx.createLinearGradient(jarX, jarY, jarX + jarWidth, jarY);
        gradient.addColorStop(0, 'rgba(200, 230, 255, 0.8)'); gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)'); gradient.addColorStop(1, 'rgba(200, 230, 255, 0.8)');
        ctx.fillStyle = gradient; ctx.fillRect(jarX + 5, jarY + 10, jarWidth - 10, jarHeight - 15);
        ctx.strokeStyle = 'rgba(100, 150, 200, 0.6)'; ctx.lineWidth = 2; ctx.strokeRect(jarX + 5, jarY + 10, jarWidth - 10, jarHeight - 15);
        const lidGradient = ctx.createLinearGradient(jarX, jarY, jarX + jarWidth, jarY);
        lidGradient.addColorStop(0, '#8B7355'); lidGradient.addColorStop(0.5, '#D4A76A'); lidGradient.addColorStop(1, '#8B7355');
        ctx.fillStyle = lidGradient; ctx.fillRect(jarX, jarY, jarWidth, 12);
        ctx.fillStyle = ing.color; ctx.globalAlpha = 0.7; ctx.fillRect(jarX + 10, jarY + 40, jarWidth - 20, jarHeight - 50); ctx.globalAlpha = 1.0;
        ctx.font = '32px Arial'; ctx.fillText(ing.emoji, jarX + 15, jarY + 35);
        ctx.fillStyle = 'rgba(255, 248, 220, 0.9)'; ctx.fillRect(jarX + 8, jarY + 60, jarWidth - 16, 18);
        ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 9px Arial'; ctx.fillText(ing.name, jarX + (jarWidth - ctx.measureText(ing.name).width) / 2, jarY + 72);
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground(); drawFloor(); drawCounter(); drawIngredients(); drawDrinkCup(); drawCustomer();
    game.animations = game.animations.filter(anim => { anim.draw(); return !anim.update(); });
    requestAnimationFrame(render);
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    game.ingredients.forEach(ing => {
        if (x >= ing.x && x <= ing.x + ing.width && y >= ing.y && y <= ing.y + ing.height) {
            const ingData = ingredientDB[ing.id];
            if (ingData.type === 'base' && !game.currentDrink.base) {
                game.currentDrink.base = ing.id;
                game.animations.push(new Animation(ingData.emoji, ing.x, ing.y, 740, 430));
            } else if (ingData.type === 'milk' && !game.currentDrink.milk) {
                game.currentDrink.milk = ing.id;
                game.animations.push(new Animation(ingData.emoji, ing.x, ing.y, 740, 410));
            } else if (ingData.type === 'topping' && game.currentDrink.toppings.length < 3) {
                game.currentDrink.toppings.push(ing.id);
                game.animations.push(new Animation(ingData.emoji, ing.x, ing.y, 740, 470));
            }
        }
    });
    // Click on cup to shake (new position: x=700, y=370, width=80, height=120)
    if (x >= 700 && x <= 780 && y >= 370 && y <= 490) {
        if (!game.currentDrink.shaken && (game.currentDrink.base || game.currentDrink.milk || game.currentDrink.toppings.length > 0)) {
            game.currentDrink.shaken = true;
        }
    }
});

function serveDrink() {
    if (!game.currentCustomer) return;
    const order = game.currentCustomer.order, drink = game.currentDrink;
    let score = 0, total = 0;
    if (order.base) { total++; if (drink.base === order.base) score++; }
    if (order.milk) { total++; if (drink.milk === order.milk) score++; }
    if (order.toppings && order.toppings.length > 0) {
        total += order.toppings.length;
        order.toppings.forEach(topping => { if (drink.toppings.includes(topping)) score++; });
    }
    if (drink.shaken) { score += 0.5; total += 0.5; }
    const finalScore = total > 0 ? score / total : 0;
    const basePrice = 4.5, multiplier = 0.7 + (finalScore * 1.3), tip = finalScore >= 0.9 ? basePrice * 0.5 : finalScore >= 0.7 ? basePrice * 0.2 : 0;
    const earnings = parseFloat((basePrice * multiplier + tip).toFixed(2));
    game.money += earnings; game.served++; game.reputation += finalScore >= 0.8 ? 10 : finalScore >= 0.6 ? 5 : 2;
    const modal = document.getElementById('resultModal'), emoji = document.getElementById('scoreEmoji');
    emoji.textContent = finalScore >= 0.9 ? '🤩' : finalScore >= 0.7 ? '😊' : finalScore >= 0.5 ? '🙂' : '😐';
    document.getElementById('feedbackText').textContent = finalScore >= 0.9 ? 'PERFECT! Exactly what I wanted!' : finalScore >= 0.7 ? 'Great job! This is delicious!' : 'Pretty good, thanks!';
    document.getElementById('earningsText').textContent = `Earned: $${earnings} (${(finalScore * 100).toFixed(0)}% match)`;
    modal.classList.add('active');
    setTimeout(() => { resetDrink(); spawnCustomer(); updateUI(); }, 3000);
}

function resetDrink() { game.currentDrink = { base: null, milk: null, toppings: [], shaken: false }; }
function closeResultModal() { document.getElementById('resultModal').classList.remove('active'); }
function spawnCustomer() {
    game.currentCustomer = customers[Math.floor(Math.random() * customers.length)];
    const bubble = document.getElementById('thoughtBubble');
    bubble.style.display = 'block';
    bubble.style.left = '700px';
    bubble.style.top = '80px';
    bubble.innerHTML = `<strong>${game.currentCustomer.name}:</strong><br>"${game.currentCustomer.order.text}"`;
}
function updateUI() {
    document.getElementById('money').textContent = `$${game.money.toFixed(2)}`;
    document.getElementById('reputation').textContent = game.reputation;
    document.getElementById('day').textContent = game.day;
    document.getElementById('served').textContent = game.served;
}

spawnCustomer(); updateUI(); render();
    </script>
</body>
</html>
