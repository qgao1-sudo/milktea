<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria Milktea Shop - Standalone Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background: #87CEEB;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stats-panel {
            background: #2c3e50;
            border: 4px solid #34495e;
            padding: 15px;
            color: #fff;
            font-size: 12px;
            pointer-events: all;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            color: #f39c12;
        }

        .stat-value {
            color: #2ecc71;
            font-weight: bold;
        }

        .instruction-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            border: 4px solid #34495e;
            padding: 20px 30px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            pointer-events: all;
            max-width: 600px;
            line-height: 1.8;
        }

        #thoughtBubble {
            position: absolute;
            background: white;
            border: 4px solid #2c3e50;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 11px;
            color: #2c3e50;
            max-width: 250px;
            line-height: 1.6;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        #thoughtBubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 30px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
        }

        .action-button {
            background: #2ecc71;
            border: 4px solid #27ae60;
            color: #fff;
            padding: 15px 30px;
            font-size: 12px;
            cursor: pointer;
            margin: 10px;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 0 4px 0 #229954;
            transition: all 0.1s;
        }

        .action-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #229954;
        }

        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #229954;
        }

        .buttons-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c3e50;
            border: 8px solid #34495e;
            padding: 40px;
            color: #fff;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal-content p {
            margin: 15px 0;
            font-size: 11px;
            line-height: 1.8;
        }

        .score-display {
            font-size: 48px;
            margin: 20px 0;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-overlay">
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">💰 Money:</span>
                    <span class="stat-value" id="money">$100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⭐ Rep:</span>
                    <span class="stat-value" id="reputation">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📅 Day:</span>
                    <span class="stat-value" id="day">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🎯 Served:</span>
                    <span class="stat-value" id="served">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="1200" height="700"></canvas>

        <div class="buttons-container">
            <button class="action-button" id="serveBtn" onclick="serveDrink()">
                🎯 SERVE DRINK
            </button>
            <button class="action-button" id="resetBtn" onclick="resetDrink()">
                🔄 RESET
            </button>
        </div>

        <div class="instruction-panel">
            <strong>HOW TO PLAY:</strong><br>
            Click on ingredient jars to add to cup → Click cup to shake → Serve to customer!<br>
            Match customer orders shown in thought bubble for tips!<br>
            <small style="opacity: 0.5;">v3.0 - Standalone Version (No Server Required!)</small>
        </div>

        <div id="thoughtBubble"></div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>ORDER COMPLETE!</h2>
            <div class="score-display" id="scoreEmoji">😊</div>
            <p id="feedbackText">Great job!</p>
            <p id="earningsText">Earned: $0</p>
            <button class="action-button" onclick="closeResultModal()">CONTINUE</button>
        </div>
    </div>

    <script>
// Game code embedded directly
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Load tea machine image
const teaMachineImage = new Image();
teaMachineImage.src = 'tea_brewing_machine.png';
let teaMachineLoaded = false;
teaMachineImage.onload = () => {
    teaMachineLoaded = true;
    console.log('Tea machine image loaded successfully');
};
teaMachineImage.onerror = () => {
    console.error('Failed to load tea machine image');
};

const game = {
    money: 100,
    reputation: 0,
    day: 1,
    served: 0,
    currentCustomer: null,
    customerX: -100, // Customer position for walking animation
    customerY: 140,
    customerTargetX: 600, // Target position at counter
    customerState: 'none', // 'walking', 'arrived', 'none'
    currentDrink: { base: null, milk: null, toppings: [], shaken: false },
    ingredients: [],
    animations: [],
    mode: 'serving', // 'serving' or 'making'
    draggedIngredient: null
};

const customers = [
    { name: "Sarah", sprite: "👩", color: "#FFB6C1", order: { text: "I want milk tea with pearls!", base: "black-tea", milk: "fresh-milk", toppings: ["pearl"] } },
    { name: "Mike", sprite: "👨", color: "#87CEEB", order: { text: "Green tea with oat milk please!", base: "green-tea", milk: "oat-milk", toppings: [] } },
    { name: "Emma", sprite: "👧", color: "#FFD700", order: { text: "Something fruity and sweet!", base: "jasmine-tea", milk: "fresh-milk", toppings: ["fruit"] } },
    { name: "Lisa", sprite: "👱‍♀️", color: "#FF69B4", order: { text: "Classic milk tea, extra pearls!", base: "black-tea", milk: "fresh-milk", toppings: ["pearl", "pearl"] } }
];

const ingredientDB = {
    // Tea bases - positioned in work area (moved forward)
    "black-tea": { name: "Black Tea", color: "#8B4513", emoji: "🍵", x: 650, y: 500, type: "base" },
    "green-tea": { name: "Green Tea", color: "#90EE90", emoji: "🍃", x: 750, y: 500, type: "base" },
    "jasmine-tea": { name: "Jasmine Tea", color: "#F0E68C", emoji: "🌸", x: 850, y: 500, type: "base" },
    // Milk options - positioned in work area
    "fresh-milk": { name: "Fresh Milk", color: "#FFFFFF", emoji: "🥛", x: 650, y: 600, type: "milk" },
    "oat-milk": { name: "Oat Milk", color: "#F5DEB3", emoji: "🌾", x: 750, y: 600, type: "milk" },
    // Toppings - positioned in work area
    "pearl": { name: "Pearls", color: "#000000", emoji: "⚫", x: 950, y: 500, type: "topping" },
    "fruit": { name: "Fruit", color: "#FF69B4", emoji: "🍓", x: 950, y: 600, type: "topping" }
};

for (let key in ingredientDB) {
    game.ingredients.push({ id: key, ...ingredientDB[key], width: 60, height: 60 });
}

class Animation {
    constructor(emoji, startX, startY, endX, endY) {
        this.emoji = emoji; this.startX = startX; this.startY = startY; this.endX = endX; this.endY = endY;
        this.frame = 0; this.maxFrame = 20;
    }
    update() { this.frame++; return this.frame >= this.maxFrame; }
    draw() {
        const progress = this.frame / this.maxFrame;
        const currentX = this.startX + (this.endX - this.startX) * progress;
        const currentY = this.startY + (this.endY - this.startY) * progress - Math.sin(progress * Math.PI) * 50;
        ctx.save(); ctx.globalAlpha = 1 - progress * 0.5; ctx.font = '32px Arial'; ctx.fillText(this.emoji, currentX, currentY); ctx.restore();
    }
}

function drawBackground() {
    // Customer area background (upper section - behind counter)
    const customerGradient = ctx.createLinearGradient(0, 0, 0, 250);
    customerGradient.addColorStop(0, '#FFE5CC');
    customerGradient.addColorStop(1, '#FFD4A3');
    ctx.fillStyle = customerGradient;
    ctx.fillRect(0, 0, 1200, 250);

    // Menu board on back wall
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(50, 30, 200, 180);
    ctx.fillStyle = '#f39c12';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('🧋 MENU', 90, 60);
    ctx.fillStyle = '#fff';
    ctx.font = '14px Arial';
    ctx.fillText('Milk Tea ... $4.5', 65, 95);
    ctx.fillText('Fruit Tea .. $5.0', 65, 120);
    ctx.fillText('Special ... $6.0', 65, 145);

    // Work area background (lower section - player side)
    const workGradient = ctx.createLinearGradient(0, 350, 0, 700);
    workGradient.addColorStop(0, '#E8D5B7');
    workGradient.addColorStop(1, '#C4A77D');
    ctx.fillStyle = workGradient;
    ctx.fillRect(0, 350, 1200, 350);
}

function drawCounter() {
    // Wooden counter - horizontal divider between customer area and work area
    // Counter top surface
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(0, 250, 1200, 100);

    // Counter front edge (darker)
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 330, 1200, 20);

    // Counter top highlight
    ctx.fillStyle = '#D2691E';
    ctx.fillRect(0, 250, 1200, 15);

    // Counter wood grain effect (simple lines)
    ctx.strokeStyle = 'rgba(139, 69, 19, 0.3)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 120, 260);
        ctx.lineTo(i * 120, 330);
        ctx.stroke();
    }
}

function drawCustomer() {
    if (!game.currentCustomer) return;

    // Customer in background area (upper section) - showing upper body
    const x = game.customerX; // Use animated position
    const y = game.customerY; // Positioned in customer area

    // Upper body (torso visible above counter)
    ctx.fillStyle = game.currentCustomer.color;
    ctx.fillRect(x - 50, y + 50, 100, 100);

    // Head
    ctx.beginPath();
    ctx.arc(x, y, 60, 0, Math.PI * 2);
    ctx.fill();

    // Face sprite - large and clear
    ctx.font = '90px Arial';
    ctx.fillText(game.currentCustomer.sprite, x - 45, y + 30);

    // Name tag (only show when customer has arrived)
    if (game.customerState === 'arrived') {
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 16px Arial';
        const nameWidth = ctx.measureText(game.currentCustomer.name).width;
        ctx.fillText(game.currentCustomer.name, x - nameWidth / 2, y + 180);
    }
}

function drawDrinkCup() {
    // Cup positioned in work area (foreground)
    const x = 400;
    const y = 480;

    // Cup body - larger for better visibility
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, y, 100, 150);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 100, 150);

    // Lid
    ctx.fillStyle = '#FF69B4';
    ctx.beginPath();
    ctx.arc(x + 50, y, 55, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Straw
    ctx.strokeStyle = '#FF0000';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(x + 50, y - 60);
    ctx.lineTo(x + 50, y + 25);
    ctx.stroke();

    // Draw drink layers
    let layerY = y + 140;
    const layerHeight = 30;

    // Toppings at bottom
    if (game.currentDrink.toppings.length > 0) {
        game.currentDrink.toppings.forEach((topping, i) => {
            ctx.fillStyle = ingredientDB[topping].color;
            ctx.fillRect(x + 7, layerY - i * 20, 86, 20);
        });
        layerY -= game.currentDrink.toppings.length * 20;
    }

    // Milk layer
    if (game.currentDrink.milk) {
        ctx.fillStyle = ingredientDB[game.currentDrink.milk].color;
        ctx.fillRect(x + 7, layerY - layerHeight, 86, layerHeight);
        layerY -= layerHeight;
    }

    // Tea base layer
    if (game.currentDrink.base) {
        ctx.fillStyle = ingredientDB[game.currentDrink.base].color;
        ctx.fillRect(x + 7, layerY - layerHeight, 86, layerHeight);
    }

    // Shake indicator
    if (game.currentDrink.shaken) {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 16px Arial';
        ctx.fillText('✓ SHAKEN', x - 5, y + 180);
    }
}

function drawTeaMachine() {
    // Tea brewing machine on the left side of work area (moved forward)
    const x = 100;
    const y = 500;
    const width = 120;
    const height = 180;

    if (teaMachineLoaded) {
        // Draw the tea machine image
        ctx.drawImage(teaMachineImage, x, y, width, height);

        // Add steam effect when brewing
        if (game.currentDrink.base) {
            ctx.font = '32px Arial';
            ctx.fillText('💨', x + 40, y - 10);
        }
    } else {
        // Fallback: Draw simple machine if image not loaded
        ctx.fillStyle = '#C0C0C0';
        ctx.fillRect(x, y, width, height);

        // Machine top
        ctx.fillStyle = '#808080';
        ctx.fillRect(x, y, width, 25);

        // Display screen
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 15, y + 40, 90, 50);

        // Status on screen
        if (game.currentDrink.base) {
            ctx.fillStyle = '#0F0';
            ctx.font = '14px monospace';
            ctx.fillText('BREWING', x + 22, y + 70);
            ctx.font = '24px Arial';
            ctx.fillText('💨', x + 45, y + 25);
        } else {
            ctx.fillStyle = '#666';
            ctx.font = '14px monospace';
            ctx.fillText('READY', x + 32, y + 70);
        }

        // Buttons
        for (let i = 0; i < 3; i++) {
            ctx.fillStyle = '#444';
            ctx.fillRect(x + 20 + i * 30, y + 110, 25, 15);
        }

        // Dispenser nozzle
        ctx.fillStyle = '#666';
        ctx.fillRect(x + 45, y + 150, 30, 30);
    }
}

function drawIngredients() {
    game.ingredients.forEach(ing => {
        const jarX = ing.x, jarY = ing.y, jarWidth = ing.width, jarHeight = ing.height + 20;
        const gradient = ctx.createLinearGradient(jarX, jarY, jarX + jarWidth, jarY);
        gradient.addColorStop(0, 'rgba(200, 230, 255, 0.8)'); gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)'); gradient.addColorStop(1, 'rgba(200, 230, 255, 0.8)');
        ctx.fillStyle = gradient; ctx.fillRect(jarX + 5, jarY + 10, jarWidth - 10, jarHeight - 15);
        ctx.strokeStyle = 'rgba(100, 150, 200, 0.6)'; ctx.lineWidth = 2; ctx.strokeRect(jarX + 5, jarY + 10, jarWidth - 10, jarHeight - 15);
        const lidGradient = ctx.createLinearGradient(jarX, jarY, jarX + jarWidth, jarY);
        lidGradient.addColorStop(0, '#8B7355'); lidGradient.addColorStop(0.5, '#D4A76A'); lidGradient.addColorStop(1, '#8B7355');
        ctx.fillStyle = lidGradient; ctx.fillRect(jarX, jarY, jarWidth, 12);
        ctx.fillStyle = ing.color; ctx.globalAlpha = 0.7; ctx.fillRect(jarX + 10, jarY + 40, jarWidth - 20, jarHeight - 50); ctx.globalAlpha = 1.0;
        ctx.font = '32px Arial'; ctx.fillText(ing.emoji, jarX + 15, jarY + 35);
        ctx.fillStyle = 'rgba(255, 248, 220, 0.9)'; ctx.fillRect(jarX + 8, jarY + 60, jarWidth - 16, 18);
        ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 9px Arial'; ctx.fillText(ing.name, jarX + (jarWidth - ctx.measureText(ing.name).width) / 2, jarY + 72);
    });
}

function drawMakingMode() {
    // Background
    ctx.fillStyle = '#E8D5B7';
    ctx.fillRect(0, 0, 1200, 700);

    // Title
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 32px Arial';
    ctx.fillText('🧋 制作奶茶', 50, 60);

    // Large cup in center
    const cupX = 500, cupY = 250;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(cupX, cupY, 150, 250);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.strokeRect(cupX, cupY, 150, 250);

    // Cup lid
    ctx.fillStyle = '#FF69B4';
    ctx.beginPath();
    ctx.arc(cupX + 75, cupY, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Straw
    ctx.strokeStyle = '#FF0000';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(cupX + 75, cupY - 80);
    ctx.lineTo(cupX + 75, cupY + 30);
    ctx.stroke();

    // Draw drink layers in cup
    let layerY = cupY + 230;
    const layerHeight = 40;

    if (game.currentDrink.toppings.length > 0) {
        game.currentDrink.toppings.forEach((topping, i) => {
            ctx.fillStyle = ingredientDB[topping].color;
            ctx.fillRect(cupX + 10, layerY - i * 30, 130, 30);
        });
        layerY -= game.currentDrink.toppings.length * 30;
    }
    if (game.currentDrink.milk) {
        ctx.fillStyle = ingredientDB[game.currentDrink.milk].color;
        ctx.fillRect(cupX + 10, layerY - layerHeight, 130, layerHeight);
        layerY -= layerHeight;
    }
    if (game.currentDrink.base) {
        ctx.fillStyle = ingredientDB[game.currentDrink.base].color;
        ctx.fillRect(cupX + 10, layerY - layerHeight, 130, layerHeight);
    }

    // Ingredient options on the right
    const startX = 800, startY = 100;
    let offsetY = 0;

    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('配料:', startX, startY);

    game.ingredients.forEach((ing, i) => {
        const x = startX;
        const y = startY + 50 + offsetY;

        // Ingredient box
        ctx.fillStyle = ing.color;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(x, y, 120, 80);
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, 120, 80);

        // Emoji
        ctx.font = '40px Arial';
        ctx.fillText(ing.emoji, x + 10, y + 50);

        // Name
        ctx.fillStyle = '#2c3e50';
        ctx.font = '12px Arial';
        ctx.fillText(ing.name, x + 10, y + 70);

        offsetY += 95;
    });

    // Done button
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(450, 580, 300, 60);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('✅ 完成制作', 510, 620);

    // Hand cursor hint
    ctx.fillStyle = '#666';
    ctx.font = '16px Arial';
    ctx.fillText('👆 点击配料拖拽到杯子里', 400, 150);
}

function updateCustomer() {
    // Animate customer walking to counter
    if (game.customerState === 'walking') {
        const speed = 3; // pixels per frame
        const distance = game.customerTargetX - game.customerX;

        if (Math.abs(distance) > speed) {
            // Still walking
            game.customerX += speed;
        } else {
            // Arrived at counter
            game.customerX = game.customerTargetX;
            game.customerState = 'arrived';

            // Show thought bubble when arrived
            const bubble = document.getElementById('thoughtBubble');
            bubble.style.display = 'block';
            bubble.style.left = (game.customerX + 150) + 'px';
            bubble.style.top = '50px';
            bubble.innerHTML = `<strong>${game.currentCustomer.name}:</strong><br>"${game.currentCustomer.order.text}"`;
        }
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update customer animation
    updateCustomer();

    if (game.mode === 'serving') {
        // Draw serving mode
        drawBackground();
        drawCounter();
        drawCustomer();
        drawTeaMachine();
        drawIngredients();
        drawDrinkCup();
    } else if (game.mode === 'making') {
        // Draw making mode
        drawMakingMode();
    }

    game.animations = game.animations.filter(anim => { anim.draw(); return !anim.update(); });
    requestAnimationFrame(render);
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;

    if (game.mode === 'serving') {
        // Check if clicked on tea machine
        if (x >= 100 && x <= 220 && y >= 500 && y <= 680) {
            game.mode = 'making';
            canvas.style.cursor = 'grab';
            return;
        }

        // Original serving mode interactions
        game.ingredients.forEach(ing => {
            if (x >= ing.x && x <= ing.x + ing.width && y >= ing.y && y <= ing.y + ing.height) {
                const ingData = ingredientDB[ing.id];
                if (ingData.type === 'base' && !game.currentDrink.base) {
                    game.currentDrink.base = ing.id;
                    game.animations.push(new Animation(ingData.emoji, ing.x, ing.y, 450, 530));
                } else if (ingData.type === 'milk' && !game.currentDrink.milk) {
                    game.currentDrink.milk = ing.id;
                    game.animations.push(new Animation(ingData.emoji, ing.x, ing.y, 450, 510));
                } else if (ingData.type === 'topping' && game.currentDrink.toppings.length < 3) {
                    game.currentDrink.toppings.push(ing.id);
                    game.animations.push(new Animation(ingData.emoji, ing.x, ing.y, 450, 570));
                }
            }
        });

        // Click on cup to shake
        if (x >= 400 && x <= 500 && y >= 480 && y <= 630) {
            if (!game.currentDrink.shaken && (game.currentDrink.base || game.currentDrink.milk || game.currentDrink.toppings.length > 0)) {
                game.currentDrink.shaken = true;
            }
        }
    } else if (game.mode === 'making') {
        // Check if clicked on done button
        if (x >= 450 && x <= 750 && y >= 580 && y <= 640) {
            game.mode = 'serving';
            game.currentDrink.shaken = true;
            canvas.style.cursor = 'default';
            return;
        }

        // Check if clicked on ingredients
        const startX = 800, startY = 150;
        game.ingredients.forEach((ing, i) => {
            const ingY = startY + i * 95;
            if (x >= startX && x <= startX + 120 && y >= ingY && y <= ingY + 80) {
                const ingData = ingredientDB[ing.id];
                // Add to drink
                if (ingData.type === 'base' && !game.currentDrink.base) {
                    game.currentDrink.base = ing.id;
                } else if (ingData.type === 'milk' && !game.currentDrink.milk) {
                    game.currentDrink.milk = ing.id;
                } else if (ingData.type === 'topping' && game.currentDrink.toppings.length < 3) {
                    game.currentDrink.toppings.push(ing.id);
                }
            }
        });
    }
});

function serveDrink() {
    if (!game.currentCustomer) return;
    const order = game.currentCustomer.order, drink = game.currentDrink;
    let score = 0, total = 0;
    if (order.base) { total++; if (drink.base === order.base) score++; }
    if (order.milk) { total++; if (drink.milk === order.milk) score++; }
    if (order.toppings && order.toppings.length > 0) {
        total += order.toppings.length;
        order.toppings.forEach(topping => { if (drink.toppings.includes(topping)) score++; });
    }
    if (drink.shaken) { score += 0.5; total += 0.5; }
    const finalScore = total > 0 ? score / total : 0;
    const basePrice = 4.5, multiplier = 0.7 + (finalScore * 1.3), tip = finalScore >= 0.9 ? basePrice * 0.5 : finalScore >= 0.7 ? basePrice * 0.2 : 0;
    const earnings = parseFloat((basePrice * multiplier + tip).toFixed(2));
    game.money += earnings; game.served++; game.reputation += finalScore >= 0.8 ? 10 : finalScore >= 0.6 ? 5 : 2;
    const modal = document.getElementById('resultModal'), emoji = document.getElementById('scoreEmoji');
    emoji.textContent = finalScore >= 0.9 ? '🤩' : finalScore >= 0.7 ? '😊' : finalScore >= 0.5 ? '🙂' : '😐';
    document.getElementById('feedbackText').textContent = finalScore >= 0.9 ? 'PERFECT! Exactly what I wanted!' : finalScore >= 0.7 ? 'Great job! This is delicious!' : 'Pretty good, thanks!';
    document.getElementById('earningsText').textContent = `Earned: $${earnings} (${(finalScore * 100).toFixed(0)}% match)`;
    modal.classList.add('active');
    setTimeout(() => { resetDrink(); spawnCustomer(); updateUI(); }, 3000);
}

function resetDrink() { game.currentDrink = { base: null, milk: null, toppings: [], shaken: false }; }
function closeResultModal() { document.getElementById('resultModal').classList.remove('active'); }
function spawnCustomer() {
    game.currentCustomer = customers[Math.floor(Math.random() * customers.length)];

    // Start customer off-screen to the left
    game.customerX = -100;
    game.customerY = 140;
    game.customerState = 'walking';

    // Hide thought bubble initially - it will show when customer arrives
    const bubble = document.getElementById('thoughtBubble');
    bubble.style.display = 'none';
}
function updateUI() {
    document.getElementById('money').textContent = `$${game.money.toFixed(2)}`;
    document.getElementById('reputation').textContent = game.reputation;
    document.getElementById('day').textContent = game.day;
    document.getElementById('served').textContent = game.served;
}

spawnCustomer(); updateUI(); render();
    </script>
</body>
