<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria Milktea Shop - Standalone Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background: #87CEEB;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stats-panel {
            background: #2c3e50;
            border: 4px solid #34495e;
            padding: 15px;
            color: #fff;
            font-size: 12px;
            pointer-events: all;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            color: #f39c12;
        }

        .stat-value {
            color: #2ecc71;
            font-weight: bold;
        }

        .instruction-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            border: 4px solid #34495e;
            padding: 20px 30px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            pointer-events: all;
            max-width: 600px;
            line-height: 1.8;
        }

        #thoughtBubble {
            position: absolute;
            background: white;
            border: 4px solid #2c3e50;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 11px;
            color: #2c3e50;
            max-width: 250px;
            line-height: 1.6;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        #thoughtBubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 30px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
        }

        .action-button {
            background: #2ecc71;
            border: 4px solid #27ae60;
            color: #fff;
            padding: 15px 30px;
            font-size: 12px;
            cursor: pointer;
            margin: 10px;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 0 4px 0 #229954;
            transition: all 0.1s;
        }

        .action-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #229954;
        }

        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #229954;
        }

        .buttons-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c3e50;
            border: 8px solid #34495e;
            padding: 40px;
            color: #fff;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal-content p {
            margin: 15px 0;
            font-size: 11px;
            line-height: 1.8;
        }

        .score-display {
            font-size: 48px;
            margin: 20px 0;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-overlay">
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">💰 Money:</span>
                    <span class="stat-value" id="money">$100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⭐ Rep:</span>
                    <span class="stat-value" id="reputation">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📅 Day:</span>
                    <span class="stat-value" id="day">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🎯 Served:</span>
                    <span class="stat-value" id="served">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="1200" height="700"></canvas>

        <div class="buttons-container">
            <button class="action-button" id="serveBtn" onclick="serveDrink()">
                🎯 SERVE DRINK
            </button>
            <button class="action-button" id="resetBtn" onclick="resetDrink()">
                🔄 RESET
            </button>
        </div>

        <div id="thoughtBubble"></div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>ORDER COMPLETE!</h2>
            <div class="score-display" id="scoreEmoji">😊</div>
            <p id="feedbackText">Great job!</p>
            <p id="earningsText">Earned: $0</p>
            <button class="action-button" onclick="closeResultModal()">CONTINUE</button>
        </div>
    </div>

    <script>
// Game code embedded directly
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Load tea machine image
const teaMachineImage = new Image();
teaMachineImage.src = 'tea_brewing_machine.png';
let teaMachineLoaded = false;
teaMachineImage.onload = () => {
    teaMachineLoaded = true;
    console.log('Tea machine image loaded successfully');
};
teaMachineImage.onerror = () => {
    console.error('Failed to load tea machine image');
};

// Load cup images for different stages
const cupImages = {
    empty: new Image(),
    strawberry: new Image(),
    strawberryMilk: new Image(),
    strawberryMilkIceCream: new Image(),
    strawberryMilkIceCreamChocolate: new Image(),
    complete: new Image()
};

cupImages.empty.src = '微信图片_20251202200937_7_1.png';
cupImages.strawberry.src = '微信图片_20251202201106_8_1.png';
cupImages.strawberryMilk.src = '微信图片_20251203012924_64_18.png';
cupImages.strawberryMilkIceCream.src = '微信图片_20251202201312_11_1.jpg';
cupImages.strawberryMilkIceCreamChocolate.src = '微信图片_20251202201413_13_1.png';
cupImages.complete.src = '微信图片_20251202201511_14_1.png';

let cupImagesLoaded = 0;
const totalCupImages = Object.keys(cupImages).length;

Object.keys(cupImages).forEach(key => {
    cupImages[key].onload = () => {
        cupImagesLoaded++;
        console.log(`Cup image ${key} loaded (${cupImagesLoaded}/${totalCupImages})`);
    };
    cupImages[key].onerror = () => {
        console.error(`Failed to load cup image: ${key}`);
    };
});

// Load customer character images
const customerImages = {
    sarahWalking1: new Image(),
    sarahWalking2: new Image(),
    sarahFront: new Image()
};

customerImages.sarahWalking1.src = '微信图片_20251203014746_70_18.jpg';
customerImages.sarahWalking2.src = '微信图片_20251203014811_71_18.png';
customerImages.sarahFront.src = '微信图片_20251203014739_66_18.png';

let customerImagesLoaded = 0;
const totalCustomerImages = Object.keys(customerImages).length;

Object.keys(customerImages).forEach(key => {
    customerImages[key].onload = () => {
        customerImagesLoaded++;
        console.log(`Customer image ${key} loaded (${customerImagesLoaded}/${totalCustomerImages})`);
    };
    customerImages[key].onerror = () => {
        console.error(`Failed to load customer image: ${key}`);
    };
});

const game = {
    money: 100,
    reputation: 0,
    day: 1,
    served: 0,
    currentCustomer: null,
    customerX: -100, // Customer position for walking animation
    customerY: 140,
    customerTargetX: 600, // Target position at counter
    customerState: 'none', // 'walking', 'arrived', 'none'
    customerWalkFrame: 0, // Animation frame for walking (0 or 1)
    customerFrameCounter: 0, // Counter for frame switching
    currentDrink: { base: null, milk: null, toppings: [], shaken: false },
    ingredients: [],
    animations: [],
    mode: 'serving', // 'serving', 'making', or 'finished'
    draggedIngredient: null
};

const customers = [
    {
        name: "Sarah",
        sprite: "👩",
        color: "#FFB6C1",
        order: { text: "I want Berry Milky Hug!", base: null, milk: "fresh-milk", toppings: ["strawberry", "ice-cream", "chocolate", "strawberry"] },
        hasImage: true,
        walkingImages: [customerImages.sarahWalking1, customerImages.sarahWalking2],
        frontImage: customerImages.sarahFront
    },
    { name: "Mike", sprite: "👨", color: "#87CEEB", order: { text: "Lemonade please!", base: "jasmine-tea", milk: null, toppings: ["lemon", "honey"] } },
    { name: "Emma", sprite: "👧", color: "#FFD700", order: { text: "Orange drink sounds refreshing!", base: "green-tea", milk: null, toppings: ["orange", "honey"] } }
];

const ingredientDB = {
    // First row: Jars (tea bases, milk, toppings) - aligned with tea machine level
    "black-tea": { name: "Black Tea", color: "#8B4513", emoji: "🍵", x: 280, y: 380, type: "base", category: "饮品", onTable: true },
    "green-tea": { name: "Green Tea", color: "#90EE90", emoji: "🍃", x: 380, y: 380, type: "base", category: "饮品", onTable: true },
    "jasmine-tea": { name: "Jasmine Tea", color: "#F0E68C", emoji: "🌸", x: 480, y: 380, type: "base", category: "饮品", onTable: true },
    "fresh-milk": { name: "Fresh Milk", color: "#FFFFFF", emoji: "🥛", x: 580, y: 380, type: "milk", category: "饮品", onTable: true },
    "oat-milk": { name: "Oat Milk", color: "#F5DEB3", emoji: "🌾", x: 680, y: 380, type: "milk", category: "饮品", onTable: true },
    "pearl": { name: "Pearls", color: "#000000", emoji: "⚫", x: 780, y: 380, type: "topping", onTable: true },
    "pudding": { name: "Pudding", color: "#FFE4B5", emoji: "🍮", x: 880, y: 380, type: "topping", onTable: true },
    "ice-cream": { name: "Ice Cream", color: "#FFF8DC", emoji: "🍦", x: 980, y: 380, type: "topping", category: "饮品", onTable: true },
    "chocolate": { name: "Chocolate", color: "#8B4513", emoji: "🍫", x: 1080, y: 380, type: "topping", category: "酱汁", onTable: true },
    // Second row: Fruit boxes - square shaped
    "strawberry": { name: "Strawberry", color: "#FF6B6B", emoji: "🍓", x: 280, y: 500, type: "fruit", shape: "square", category: "水果", onTable: true },
    "mango": { name: "Mango", color: "#FFA500", emoji: "🥭", x: 380, y: 500, type: "fruit", shape: "square", category: "水果", onTable: true },
    "lychee": { name: "Lychee", color: "#FFB6C1", emoji: "🍈", x: 480, y: 500, type: "fruit", shape: "square", category: "水果", onTable: true },
    "passion-fruit": { name: "Passion", color: "#9370DB", emoji: "🟣", x: 580, y: 500, type: "fruit", shape: "square", category: "水果", onTable: true },
    "blueberry": { name: "Blueberry", color: "#4169E1", emoji: "🫐", x: 680, y: 500, type: "fruit", shape: "square", category: "水果", onTable: true },
    "kiwi": { name: "Kiwi", color: "#9ACD32", emoji: "🥝", x: 780, y: 500, type: "fruit", shape: "square", category: "水果", onTable: true },
    // New ingredients - only in making mode
    "honey": { name: "Honey", color: "#FFD700", emoji: "🍯", type: "topping", category: "酱汁", onTable: false },
    "lemon": { name: "Lemon", color: "#FFF44F", emoji: "🍋", type: "fruit", category: "水果", onTable: false },
    "orange": { name: "Orange", color: "#FFA500", emoji: "🍊", type: "fruit", category: "水果", onTable: false }
};

for (let key in ingredientDB) {
    const ing = { id: key, ...ingredientDB[key], width: 80, height: 80 };
    game.ingredients.push(ing);
}

class Animation {
    constructor(emoji, startX, startY, endX, endY) {
        this.emoji = emoji; this.startX = startX; this.startY = startY; this.endX = endX; this.endY = endY;
        this.frame = 0; this.maxFrame = 20;
    }
    update() { this.frame++; return this.frame >= this.maxFrame; }
    draw() {
        const progress = this.frame / this.maxFrame;
        const currentX = this.startX + (this.endX - this.startX) * progress;
        const currentY = this.startY + (this.endY - this.startY) * progress - Math.sin(progress * Math.PI) * 50;
        ctx.save(); ctx.globalAlpha = 1 - progress * 0.5; ctx.font = '32px Arial'; ctx.fillText(this.emoji, currentX, currentY); ctx.restore();
    }
}

function getCurrentCupImage() {
    // Determine which cup image to show based on current drink ingredients
    const drink = game.currentDrink;

    // Count strawberries
    const strawberryCount = drink.toppings.filter(t => t === 'strawberry').length;
    const hasIceCream = drink.toppings.includes('ice-cream');
    const hasChocolate = drink.toppings.includes('chocolate');
    const hasMilk = drink.milk !== null;

    // Check the specific sequence
    if (strawberryCount >= 2 && hasMilk && hasIceCream && hasChocolate) {
        // Final stage: strawberry + milk + ice cream + chocolate + strawberry
        return cupImages.complete;
    } else if (strawberryCount >= 1 && hasMilk && hasIceCream && hasChocolate) {
        // Stage 4: strawberry + milk + ice cream + chocolate
        return cupImages.strawberryMilkIceCreamChocolate;
    } else if (strawberryCount >= 1 && hasMilk && hasIceCream) {
        // Stage 3: strawberry + milk + ice cream
        return cupImages.strawberryMilkIceCream;
    } else if (strawberryCount >= 1 && hasMilk) {
        // Stage 2: strawberry + milk
        return cupImages.strawberryMilk;
    } else if (strawberryCount >= 1) {
        // Stage 1: strawberry only
        return cupImages.strawberry;
    } else {
        // Empty cup
        return cupImages.empty;
    }
}

// Check if we should hide the colored layers (for specific cup image sequences)
function shouldHideLayers() {
    const drink = game.currentDrink;
    const strawberryCount = drink.toppings.filter(t => t === 'strawberry').length;
    const hasIceCream = drink.toppings.includes('ice-cream');
    const hasChocolate = drink.toppings.includes('chocolate');
    const hasMilk = drink.milk !== null;

    // Hide layers for the strawberry-based sequence:
    // 1. Empty cup with strawberry
    // 2. Strawberry + milk
    // 3. Strawberry + milk + ice cream
    // 4. Strawberry + milk + ice cream + chocolate
    // 5. Strawberry + milk + ice cream + chocolate + strawberry (complete)

    // If we have strawberry and are following the specific sequence, hide layers
    if (strawberryCount >= 1) {
        // Check if only strawberry (no milk, ice cream, chocolate)
        if (!hasMilk && !hasIceCream && !hasChocolate) {
            return true;
        }
        // Check if strawberry + milk only
        if (hasMilk && !hasIceCream && !hasChocolate) {
            return true;
        }
        // Check if strawberry + milk + ice cream
        if (hasMilk && hasIceCream && !hasChocolate) {
            return true;
        }
        // Check if strawberry + milk + ice cream + chocolate (one strawberry)
        if (hasMilk && hasIceCream && hasChocolate && strawberryCount === 1) {
            return true;
        }
        // Check if complete (two strawberries + milk + ice cream + chocolate)
        if (hasMilk && hasIceCream && hasChocolate && strawberryCount >= 2) {
            return true;
        }
    }

    return false;
}

function drawBackground() {
    // Customer area background (upper section - behind counter)
    const customerGradient = ctx.createLinearGradient(0, 0, 0, 250);
    customerGradient.addColorStop(0, '#FFE5CC');
    customerGradient.addColorStop(1, '#FFD4A3');
    ctx.fillStyle = customerGradient;
    ctx.fillRect(0, 0, 1200, 250);

    // Menu board on back wall
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(50, 30, 200, 180);
    ctx.fillStyle = '#f39c12';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('🧋 MENU', 90, 60);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText('Berry Milky Hug', 60, 95);
    ctx.fillText('.......... $6.5', 60, 110);
    ctx.fillText('Lemonade', 60, 135);
    ctx.fillText('.......... $4.5', 60, 150);
    ctx.fillText('Orange Drink', 60, 175);
    ctx.fillText('.......... $4.5', 60, 190);

    // Decorative Poster 1 - Bubble Tea
    ctx.fillStyle = '#FF69B4';
    ctx.fillRect(800, 40, 140, 160);
    ctx.fillStyle = '#FFB6C1';
    ctx.fillRect(810, 50, 120, 140);
    ctx.font = '60px Arial';
    ctx.fillText('🧋', 845, 110);
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('GLORIA', 830, 150);
    ctx.font = '12px Arial';
    ctx.fillText('Milk Tea', 840, 170);

    // Decorative Poster 2 - Fruit Tea
    ctx.fillStyle = '#FFA500';
    ctx.fillRect(970, 40, 140, 160);
    ctx.fillStyle = '#FFE4B5';
    ctx.fillRect(980, 50, 120, 140);
    ctx.font = '50px Arial';
    ctx.fillText('🍓🥭', 995, 110);
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('FRESH', 1010, 150);
    ctx.font = '12px Arial';
    ctx.fillText('Fruit Series', 995, 170);

    // Decorative Poster 3 - Special Offer
    ctx.fillStyle = '#9370DB';
    ctx.fillRect(300, 40, 140, 160);
    ctx.fillStyle = '#DDA0DD';
    ctx.fillRect(310, 50, 120, 140);
    ctx.font = '60px Arial';
    ctx.fillText('⭐', 345, 110);
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('SPECIAL', 330, 150);
    ctx.font = '12px Arial';
    ctx.fillText('Today Only!', 335, 170);

    // Work area background (lower section - player side)
    const workGradient = ctx.createLinearGradient(0, 350, 0, 700);
    workGradient.addColorStop(0, '#E8D5B7');
    workGradient.addColorStop(1, '#C4A77D');
    ctx.fillStyle = workGradient;
    ctx.fillRect(0, 350, 1200, 350);
}

function drawCounter() {
    // Wooden counter - horizontal divider between customer area and work area
    // Counter top surface
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(0, 250, 1200, 100);

    // Counter front edge (darker)
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 330, 1200, 20);

    // Counter top highlight
    ctx.fillStyle = '#D2691E';
    ctx.fillRect(0, 250, 1200, 15);

    // Counter wood grain effect (simple lines)
    ctx.strokeStyle = 'rgba(139, 69, 19, 0.3)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 120, 260);
        ctx.lineTo(i * 120, 330);
        ctx.stroke();
    }
}

function drawCustomer() {
    if (!game.currentCustomer) return;

    // Customer in background area (upper section) - showing upper body
    const x = game.customerX; // Use animated position
    const y = game.customerY; // Positioned in customer area

    // Check if customer has custom images
    if (game.currentCustomer.hasImage) {
        let currentImage;

        // Select image based on state
        if (game.customerState === 'walking') {
            // Alternate between two walking images
            currentImage = game.currentCustomer.walkingImages[game.customerWalkFrame];
        } else if (game.customerState === 'arrived') {
            // Use front-facing image when arrived
            currentImage = game.currentCustomer.frontImage;
        }

        // Draw customer image if loaded
        if (currentImage && currentImage.complete) {
            // Draw image centered on position
            const imgWidth = 120;
            const imgHeight = 180;
            ctx.drawImage(currentImage, x - imgWidth / 2, y - imgHeight / 2, imgWidth, imgHeight);
        } else {
            // Fallback to emoji if image not loaded
            drawCustomerEmoji(x, y);
        }
    } else {
        // Use emoji for customers without custom images
        drawCustomerEmoji(x, y);
    }

    // Name tag (only show when customer has arrived)
    if (game.customerState === 'arrived') {
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 16px Arial';
        const nameWidth = ctx.measureText(game.currentCustomer.name).width;
        ctx.fillText(game.currentCustomer.name, x - nameWidth / 2, y + 120);
    }
}

// Helper function to draw emoji-based customer
function drawCustomerEmoji(x, y) {
    // Upper body (torso visible above counter)
    ctx.fillStyle = game.currentCustomer.color;
    ctx.fillRect(x - 50, y + 50, 100, 100);

    // Head
    ctx.beginPath();
    ctx.arc(x, y, 60, 0, Math.PI * 2);
    ctx.fill();

    // Face sprite - large and clear
    ctx.font = '90px Arial';
    ctx.fillText(game.currentCustomer.sprite, x - 45, y + 30);
}

function drawDrinkCup() {
    // Cup positioned in work area (foreground)
    const x = 400;
    const y = 480;

    // Cup body - larger for better visibility
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, y, 100, 150);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, 100, 150);

    // Lid
    ctx.fillStyle = '#FF69B4';
    ctx.beginPath();
    ctx.arc(x + 50, y, 55, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Straw
    ctx.strokeStyle = '#FF0000';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(x + 50, y - 60);
    ctx.lineTo(x + 50, y + 25);
    ctx.stroke();

    // Draw drink layers
    let layerY = y + 140;
    const layerHeight = 30;

    // Toppings at bottom
    if (game.currentDrink.toppings.length > 0) {
        game.currentDrink.toppings.forEach((topping, i) => {
            ctx.fillStyle = ingredientDB[topping].color;
            ctx.fillRect(x + 7, layerY - i * 20, 86, 20);
        });
        layerY -= game.currentDrink.toppings.length * 20;
    }

    // Milk layer
    if (game.currentDrink.milk) {
        ctx.fillStyle = ingredientDB[game.currentDrink.milk].color;
        ctx.fillRect(x + 7, layerY - layerHeight, 86, layerHeight);
        layerY -= layerHeight;
    }

    // Tea base layer

        ctx.fillStyle = ingredientDB[game.currentDrink.base].color;

    // Shake indicator

function drawIngredients() {
    game.ingredients.forEach(ing => {
        // Only draw ingredients that are on the table
        if (!ing.onTable) return;

        const jarX = ing.x, jarY = ing.y, jarWidth = ing.width, jarHeight = ing.height;

        if (ing.shape === 'square') {
            // Draw square fruit box
            // Box shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(jarX + 3, jarY + 3, jarWidth, jarHeight);

            // Main box with border
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(jarX, jarY, jarWidth, jarHeight);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            ctx.strokeRect(jarX, jarY, jarWidth, jarHeight);

            // Fruit color background (semi-transparent)
            ctx.fillStyle = ing.color;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(jarX + 5, jarY + 5, jarWidth - 10, jarHeight - 10);
            ctx.globalAlpha = 1.0;

            // Fruit emoji
            ctx.font = '40px Arial';
            ctx.fillText(ing.emoji, jarX + jarWidth/2 - 20, jarY + jarHeight/2 + 10);

            // Name label at bottom
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 10px Arial';
            const nameWidth = ctx.measureText(ing.name).width;
            ctx.fillText(ing.name, jarX + (jarWidth - nameWidth) / 2, jarY + jarHeight - 10);
        } else {
            // Draw glass jar (original style)
            const jarHeightExt = jarHeight + 20;
            const gradient = ctx.createLinearGradient(jarX, jarY, jarX + jarWidth, jarY);
            gradient.addColorStop(0, 'rgba(200, 230, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)');
            gradient.addColorStop(1, 'rgba(200, 230, 255, 0.8)');
            ctx.fillStyle = gradient;
            ctx.fillRect(jarX + 5, jarY + 10, jarWidth - 10, jarHeightExt - 15);
            ctx.strokeStyle = 'rgba(100, 150, 200, 0.6)';
            ctx.lineWidth = 2;
            ctx.strokeRect(jarX + 5, jarY + 10, jarWidth - 10, jarHeightExt - 15);

            const lidGradient = ctx.createLinearGradient(jarX, jarY, jarX + jarWidth, jarY);
            lidGradient.addColorStop(0, '#8B7355');
            lidGradient.addColorStop(0.5, '#D4A76A');
            lidGradient.addColorStop(1, '#8B7355');
            ctx.fillStyle = lidGradient;
            ctx.fillRect(jarX, jarY, jarWidth, 12);

            ctx.fillStyle = ing.color;
            ctx.globalAlpha = 0.7;
            ctx.fillRect(jarX + 10, jarY + 40, jarWidth - 20, jarHeightExt - 50);
            ctx.globalAlpha = 1.0;

            ctx.font = '40px Arial';
            ctx.fillText(ing.emoji, jarX + 15, jarY + 40);

            ctx.fillStyle = 'rgba(255, 248, 220, 0.9)';
            ctx.fillRect(jarX + 8, jarY + 70, jarWidth - 16, 20);
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 11px Arial';
            const nameWidth = ctx.measureText(ing.name).width;
            ctx.fillText(ing.name, jarX + (jarWidth - nameWidth) / 2, jarY + 84);
        }
    });
}

function drawMakingMode() {

    // Large cup in center
    const cupX = 500, cupY = 250;
    const cupWidth = 150, cupHeight = 250;

    // Draw drink layers in cup first (behind the cup image)

        let layerY = cupY + 230;
        const layerHeight = 40;

        if (game.currentDrink.toppings.length > 0) {
            game.currentDrink.toppings.forEach((topping, i) => {
                ctx.fillStyle = ingredientDB[topping].color;
                ctx.fillRect(cupX + 10, layerY - i * 30, 130, 30);
            });
            layerY -= game.currentDrink.toppings.length * 30;
        }
        if (game.currentDrink.milk) {
            ctx.fillStyle = ingredientDB[game.currentDrink.milk].color;
            ctx.fillRect(cupX + 10, layerY - layerHeight, 130, layerHeight);
            layerY -= layerHeight;
        }
        if (game.currentDrink.base) {
            ctx.fillStyle = ingredientDB[game.currentDrink.base].color;
            ctx.fillRect(cupX + 10, layerY - layerHeight, 130, layerHeight);
        }
    }

    // Draw cup image on top - use dynamic cup image based on ingredients
    const currentCupImage = getCurrentCupImage();
    if (currentCupImage && currentCupImage.complete) {
        ctx.drawImage(currentCupImage, cupX, cupY, cupWidth, cupHeight);
    } else {
        // Fallback: draw simple cup if image not loaded
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(cupX, cupY, cupWidth, cupHeight);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.strokeRect(cupX, cupY, cupWidth, cupHeight);

        // Cup lid
        ctx.fillStyle = '#FF69B4';
        ctx.beginPath();
        ctx.arc(cupX + 75, cupY, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Straw
        ctx.strokeStyle = '#FF0000';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(cupX + 75, cupY - 80);
        ctx.lineTo(cupX + 75, cupY + 30);
        ctx.stroke();
    }

    // Ingredient options - categorized display
    const startX = 750, startY = 80;
    const boxWidth = 60, boxHeight = 60;
    const spacingX = 70, spacingY = 70;

    let currentY = startY;

    // Group ingredients by category
    const categories = {
        '水果': game.ingredients.filter(ing => ing.category === '水果'),
        '酱汁': game.ingredients.filter(ing => ing.category === '酱汁'),
        '饮品': game.ingredients.filter(ing => ing.category === '饮品')
    };

    // Also add base and milk
    const bases = game.ingredients.filter(ing => ing.type === 'base');
    const milks = game.ingredients.filter(ing => ing.type === 'milk');
    const otherToppings = game.ingredients.filter(ing => (ing.type === 'topping' || ing.type === 'fruit') && !ing.category);

    // Draw each category
    Object.keys(categories).forEach(categoryName => {
        const items = categories[categoryName];
        if (items.length === 0) return;

        // Category title
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 16px Arial';
        ctx.fillText(categoryName, startX, currentY);
        currentY += 25;

        // Draw items in this category
        items.forEach((ing, i) => {
            const x = startX + (i % 3) * spacingX;
            const y = currentY + Math.floor(i / 3) * spacingY;

            // Ingredient box
            ctx.fillStyle = ing.color;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(x, y, boxWidth, boxHeight);
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, boxWidth, boxHeight);

            // Emoji
            ctx.font = '28px Arial';
            ctx.fillText(ing.emoji, x + 8, y + 38);

            // Name
            ctx.fillStyle = '#2c3e50';
            ctx.font = '8px Arial';
            const nameWidth = ctx.measureText(ing.name).width;
            ctx.fillText(ing.name, x + (boxWidth - nameWidth) / 2, y + 53);
        });

        currentY += Math.ceil(items.length / 3) * spacingY + 15;
    });

    // Done button - moved up to avoid overlap with bottom buttons
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(450, 520, 300, 60);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('✅ 完成制作', 510, 560);

    // Hand cursor hint
    ctx.fillStyle = '#666';
    ctx.font = '16px Arial';
    ctx.fillText('👆 点击配料拖拽到杯子里', 400, 150);
}

function updateCustomer() {
    // Animate customer walking to counter
    if (game.customerState === 'walking') {
        const speed = 3; // pixels per frame
        const distance = game.customerTargetX - game.customerX;

        if (Math.abs(distance) > speed) {
            // Still walking
            game.customerX += speed;

            // Update walking animation frame (switch every 10 frames)
            game.customerFrameCounter++;
            if (game.customerFrameCounter >= 10) {
                game.customerFrameCounter = 0;
                game.customerWalkFrame = game.customerWalkFrame === 0 ? 1 : 0;
            }
        } else {
            // Arrived at counter
            game.customerX = game.customerTargetX;
            game.customerState = 'arrived';

            // Show thought bubble when arrived
            const bubble = document.getElementById('thoughtBubble');
            bubble.style.display = 'block';
            bubble.style.left = (game.customerX + 150) + 'px';
            bubble.style.top = '50px';
            bubble.innerHTML = `<strong>${game.currentCustomer.name}:</strong><br>"${game.currentCustomer.order.text}"`;
        }
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update customer animation
    updateCustomer();

    if (game.mode === 'serving') {
        // Draw serving mode
        drawBackground();
        drawCounter();
        drawCustomer();
        drawTeaMachine();
        drawIngredients();
    } else if (game.mode === 'making') {
        // Draw making mode
        drawMakingMode();
    } else if (game.mode === 'finished') {
        // Draw finished drink display
        drawFinishedDrink();
    }

    game.animations = game.animations.filter(anim => { anim.draw(); return !anim.update(); });
    requestAnimationFrame(render);
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;

    if (game.mode === 'serving') {
        // Check if clicked on tea machine
        if (x >= 100 && x <= 250 && y >= 370 && y <= 590) {
            game.mode = 'making';
            canvas.style.cursor = 'grab';
            return;
        }

        // In serving mode, ingredients can only be clicked in making mode
        // No direct ingredient interaction in serving mode
    } else if (game.mode === 'making') {
        // Check if clicked on done button (moved up)
        if (x >= 450 && x <= 750 && y >= 520 && y <= 580) {
            game.mode = 'finished';
            game.currentDrink.shaken = true;
            canvas.style.cursor = 'default';
            return;
        }

        // Check if clicked on ingredients (categorized layout)
        const startX = 750, startY = 80;
        const boxWidth = 60, boxHeight = 60;
        const spacingX = 70, spacingY = 70;

        let currentY = startY;

        // Group ingredients by category
        const categories = {
            '水果': game.ingredients.filter(ing => ing.category === '水果'),
            '酱汁': game.ingredients.filter(ing => ing.category === '酱汁'),
            '饮品': game.ingredients.filter(ing => ing.category === '饮品')
        };

        // Check each category
        Object.keys(categories).forEach(categoryName => {
            const items = categories[categoryName];
            if (items.length === 0) return;

            currentY += 25; // Skip category title

            items.forEach((ing, i) => {
                const ingX = startX + (i % 3) * spacingX;
                const ingY = currentY + Math.floor(i / 3) * spacingY;

                if (x >= ingX && x <= ingX + boxWidth && y >= ingY && y <= ingY + boxHeight) {
                    const ingData = ingredientDB[ing.id];
                    // Add to drink - increased limit to 5
                    if (ingData.type === 'base' && !game.currentDrink.base) {
                        game.currentDrink.base = ing.id;
                    } else if (ingData.type === 'milk' && !game.currentDrink.milk) {
                        game.currentDrink.milk = ing.id;
                    } else if ((ingData.type === 'topping' || ingData.type === 'fruit') && game.currentDrink.toppings.length < 5) {
                        game.currentDrink.toppings.push(ing.id);
                    }
                }
            });

            currentY += Math.ceil(items.length / 3) * spacingY + 15;
        });
    } else if (game.mode === 'finished') {
        // Check if clicked on continue button
        if (x >= 500 && x <= 700 && y >= 590 && y <= 640) {
            game.mode = 'serving';
            canvas.style.cursor = 'default';
            return;
        }
    }
});

function serveDrink() {
    if (!game.currentCustomer) return;
    const order = game.currentCustomer.order, drink = game.currentDrink;
    let score = 0, total = 0;
    if (order.base) { total++; if (drink.base === order.base) score++; }
    if (order.milk) { total++; if (drink.milk === order.milk) score++; }
    if (order.toppings && order.toppings.length > 0) {
        total += order.toppings.length;
        order.toppings.forEach(topping => { if (drink.toppings.includes(topping)) score++; });
    }
    if (drink.shaken) { score += 0.5; total += 0.5; }
    const finalScore = total > 0 ? score / total : 0;
    const basePrice = 4.5, multiplier = 0.7 + (finalScore * 1.3), tip = finalScore >= 0.9 ? basePrice * 0.5 : finalScore >= 0.7 ? basePrice * 0.2 : 0;
    const earnings = parseFloat((basePrice * multiplier + tip).toFixed(2));
    game.money += earnings; game.served++; game.reputation += finalScore >= 0.8 ? 10 : finalScore >= 0.6 ? 5 : 2;
    const modal = document.getElementById('resultModal'), emoji = document.getElementById('scoreEmoji');
    emoji.textContent = finalScore >= 0.9 ? '🤩' : finalScore >= 0.7 ? '😊' : finalScore >= 0.5 ? '🙂' : '😐';
    document.getElementById('feedbackText').textContent = finalScore >= 0.9 ? 'PERFECT! Exactly what I wanted!' : finalScore >= 0.7 ? 'Great job! This is delicious!' : 'Pretty good, thanks!';
    document.getElementById('earningsText').textContent = `Earned: $${earnings} (${(finalScore * 100).toFixed(0)}% match)`;
    modal.classList.add('active');
    setTimeout(() => { resetDrink(); spawnCustomer(); updateUI(); }, 3000);
}

function resetDrink() { game.currentDrink = { base: null, milk: null, toppings: [], shaken: false }; }
function closeResultModal() { document.getElementById('resultModal').classList.remove('active'); }
function spawnCustomer() {
    game.currentCustomer = customers[Math.floor(Math.random() * customers.length)];

    // Start customer off-screen to the left
    game.customerX = -100;
    game.customerY = 140;
    game.customerState = 'walking';

    // Reset walking animation frame
    game.customerWalkFrame = 0;
    game.customerFrameCounter = 0;

    // Hide thought bubble initially - it will show when customer arrives
    const bubble = document.getElementById('thoughtBubble');
    bubble.style.display = 'none';
}
function updateUI() {
    document.getElementById('money').textContent = `$${game.money.toFixed(2)}`;
    document.getElementById('reputation').textContent = game.reputation;
    document.getElementById('day').textContent = game.day;
    document.getElementById('served').textContent = game.served;
}

spawnCustomer(); updateUI(); render();
    </script>
