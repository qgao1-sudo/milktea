<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria Milktea Shop - Standalone Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #gameCanvas {
            background: #87CEEB;
            border: 8px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            cursor: pointer;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stats-panel {
            background: #2c3e50;
            border: 4px solid #34495e;
            padding: 15px;
            color: #fff;
            font-size: 12px;
            pointer-events: all;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            color: #f39c12;
        }

        .stat-value {
            color: #2ecc71;
            font-weight: bold;
        }

        .instruction-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            border: 4px solid #34495e;
            padding: 20px 30px;
            color: #fff;
            font-size: 10px;
            text-align: center;
            pointer-events: all;
            max-width: 600px;
            line-height: 1.8;
        }

        #thoughtBubble {
            position: absolute;
            background: white;
            border: 5px solid #2c3e50;
            border-radius: 25px;
            padding: 20px 30px;
            font-size: 16px;
            color: #2c3e50;
            max-width: 350px;
            line-height: 1.6;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        #thoughtBubble::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 40px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 25px solid white;
        }

        .action-button {
            background: #2ecc71;
            border: 4px solid #27ae60;
            color: #fff;
            padding: 15px 30px;
            font-size: 12px;
            cursor: pointer;
            margin: 10px;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 0 4px 0 #229954;
            transition: all 0.1s;
        }

        .action-button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #229954;
        }

        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #229954;
        }

        .buttons-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2c3e50;
            border: 8px solid #34495e;
            padding: 40px;
            color: #fff;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal-content p {
            margin: 15px 0;
            font-size: 11px;
            line-height: 1.8;
        }

        .score-display {
            font-size: 48px;
            margin: 20px 0;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
    </style>
</head>

class Animation {
    constructor(emoji, startX, startY, endX, endY) {
        this.emoji = emoji; this.startX = startX; this.startY = startY; this.endX = endX; this.endY = endY;
        this.frame = 0; this.maxFrame = 20;
    }
    update() { this.frame++; return this.frame >= this.maxFrame; }
    draw() {
        const progress = this.frame / this.maxFrame;
        const currentX = this.startX + (this.endX - this.startX) * progress;
        const currentY = this.startY + (this.endY - this.startY) * progress - Math.sin(progress * Math.PI) * 50;
        ctx.save(); ctx.globalAlpha = 1 - progress * 0.5; ctx.font = '32px Arial'; ctx.fillText(this.emoji, currentX, currentY); ctx.restore();
    }
}

// Helper function to check if toppings match exactly (order doesn't matter)
function toppingsMatchExactly(toppings, expected) {
    if (toppings.length !== expected.length) return false;
    const toppingsCopy = [...toppings].sort();
    const expectedCopy = [...expected].sort();
    return toppingsCopy.every((t, i) => t === expectedCopy[i]);
}

// Check if we should hide the colored layers (for specific cup image sequences)
function shouldHideLayers() {
    const drink = game.currentDrink;

    // Check for lemon series
    const hasLemon = drink.toppings.includes('lemon');
    const hasHoney = drink.toppings.includes('honey');
    const hasJasmineTea = drink.base === 'jasmine-tea';

    // Hide layers for the lemon-based sequence:
    // 1. Lemon only
    // 2. Lemon + honey
    // 3. Lemon + honey + jasmine tea
    if (hasLemon) {
        if (hasLemon && hasHoney && hasJasmineTea) {
            return true;
        } else if (hasLemon && hasHoney) {
            return true;
        } else if (hasLemon) {
            return true;
        }
    }

    // Check for orange series
    const hasOrange = drink.toppings.includes('orange');
    const hasGreenTea = drink.base === 'green-tea';

    // Hide layers for the orange-based sequence:
    // 1. Orange only
    // 2. Orange + honey
    // 3. Orange + honey + green tea
    if (hasOrange) {
        if (hasOrange && hasHoney && hasGreenTea) {
            return true;
        } else if (hasOrange && hasHoney) {
            return true;
        } else if (hasOrange) {
            return true;
        }
    }

    // Check for strawberry series
    const strawberryCount = drink.toppings.filter(t => t === 'strawberry').length;
    const hasIceCream = drink.toppings.includes('ice-cream');
    const hasChocolate = drink.toppings.includes('chocolate');
    const hasMilk = drink.milk !== null;

    // Hide layers for the strawberry-based sequence:
    // 1. Empty cup with strawberry
    // 2. Strawberry + milk
    // 3. Strawberry + milk + ice cream
    // 4. Strawberry + milk + ice cream + chocolate
    // 5. Strawberry + milk + ice cream + chocolate + strawberry (complete)

    // If we have strawberry and are following the specific sequence, hide layers
    if (strawberryCount >= 1) {
        // Check if only strawberry (no milk, ice cream, chocolate)
        if (!hasMilk && !hasIceCream && !hasChocolate) {
            return true;
        }
        // Check if strawberry + milk only
        if (hasMilk && !hasIceCream && !hasChocolate) {
            return true;
        }
        // Check if strawberry + milk + ice cream
        if (hasMilk && hasIceCream && !hasChocolate) {
            return true;
        }
        // Check if strawberry + milk + ice cream + chocolate (one strawberry)
        if (hasMilk && hasIceCream && hasChocolate && strawberryCount === 1) {
            return true;
        }
        // Check if complete (two strawberries + milk + ice cream + chocolate)
        if (hasMilk && hasIceCream && hasChocolate && strawberryCount >= 2) {
            return true;
        }
    }

    // Check for blueberry series
    const hasBlueberry = drink.toppings.includes('blueberry');
    const hasCream = drink.toppings.includes('cream');

    // Hide layers for the blueberry-based sequence:
    // 1. Blueberry only
    // 2. Blueberry + milk
    // 3. Blueberry + milk + cream
    if (hasBlueberry) {
        if (hasBlueberry && hasMilk && hasCream) {
            return true;
        } else if (hasBlueberry && hasMilk) {
            return true;
        } else if (hasBlueberry) {
            return true;
        }
    }

    // Check for mango series
    const hasMango = drink.toppings.includes('mango');

    // Hide layers for the mango-based sequence:
    // 1. Mango only
    // 2. Mango + milk
    // 3. Mango + milk + cream
    // 4. Mango + milk + cream + ice cream
    if (hasMango) {
        if (hasMango && hasMilk && hasCream && hasIceCream) {
            return true;
        } else if (hasMango && hasMilk && hasCream) {
            return true;
        } else if (hasMango && hasMilk) {
            return true;
        } else if (hasMango) {
            return true;
        }
    }

    // Check for passion fruit series
    const hasPassionFruit = drink.toppings.includes('passion-fruit');
    const hasPearl = drink.toppings.includes('pearl');

    // Hide layers for the passion fruit-based sequence:
    // 1. Passion fruit only
    // 2. Passion fruit + jasmine tea
    // 3. Passion fruit + jasmine tea + pearl
    if (hasPassionFruit) {
        if (hasPassionFruit && hasJasmineTea && hasPearl) {
            return true;
        } else if (hasPassionFruit && hasJasmineTea) {
            return true;
        } else if (hasPassionFruit) {
            return true;
        }
    }

    // Check for lychee
    const hasLychee = drink.toppings.includes('lychee');
    if (hasLychee) {
        return true;
    }

    // Check for kiwi
    const hasKiwi = drink.toppings.includes('kiwi');
    if (hasKiwi) {
        return true;
    }

    // Check for chocolate series
    const hasChocolateSauce = drink.toppings.includes('chocolate');
    const hasAnyLiquid = drink.milk !== null || drink.base !== null;

    // Hide layers for the chocolate-based sequence:
    // 1. Chocolate only
    // 2. Chocolate + any liquid (milk or tea)
    if (hasChocolateSauce) {
        return true;
    }

    // Check for cream only
    if (hasCream && drink.toppings.length === 1 && !drink.base && !drink.milk) {
        return true;
    }

    // Check for pearl only
    if (hasPearl && drink.toppings.length === 1 && !drink.base && !drink.milk) {
        return true;
    }

    // Check for ice cream only
    if (hasIceCream && drink.toppings.length === 1 && !drink.base && !drink.milk) {
        return true;
    }

    // Check for black tea only
    const hasBlackTea = drink.base === 'black-tea';
    if (hasBlackTea && drink.toppings.length === 0 && !drink.milk) {
        return true;
    }

    // Check for green tea only (hasGreenTea already defined earlier)
    if (hasGreenTea && drink.toppings.length === 0 && !drink.milk) {
        return true;
    }

    return false;
}

function drawCustomer() {
    if (!game.currentCustomer) return;

    // Customer in background area (upper section) - showing upper body
    const x = game.customerX; // Use animated position
    const y = game.customerY; // Positioned in customer area

    // Check if customer has custom images
    if (game.currentCustomer.hasImage) {
        let currentImage;

        // Select image based on state
        if (game.customerState === 'walking') {
            // Alternate between two walking images
            currentImage = game.currentCustomer.walkingImages[game.customerWalkFrame];
        } else if (game.customerState === 'arrived') {
            // Use front-facing image when arrived
            currentImage = game.currentCustomer.frontImage;
        }

        // Draw customer image if loaded
        if (currentImage && currentImage.complete) {
            // Draw image centered on position - enlarged
            const imgWidth = 200;
            const imgHeight = 300;
            ctx.drawImage(currentImage, x - imgWidth / 2, y - imgHeight / 2, imgWidth, imgHeight);
        } else {
            // Fallback to emoji if image not loaded
            drawCustomerEmoji(x, y);
        }
    } else {
        // Use emoji for customers without custom images
        drawCustomerEmoji(x, y);
    }

    // Name tag (only show when customer has arrived)
    if (game.customerState === 'arrived') {
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 16px Arial';
        const nameWidth = ctx.measureText(game.currentCustomer.name).width;
        ctx.fillText(game.currentCustomer.name, x - nameWidth / 2, y + 120);
    }
}

        if (stickyNoteLoaded) {

            ctx.arc(pinX - 2, pinY - 2, 3, 0, Math.PI * 2);
            ctx.fill();

            // Pushpin shadow
            ctx.fillStyle = '#808080';
            ctx.beginPath();
            ctx.arc(pinX + 1, pinY + 1, 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // Fallback: draw yellow sticky note if image not loaded
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(noteX + 3, noteY + 3, noteWidth, noteHeight);
            ctx.fillStyle = '#FFEB3B';
            ctx.fillRect(noteX, noteY, noteWidth, noteHeight);
            ctx.strokeStyle = '#FDD835';
            ctx.lineWidth = 2;
            ctx.strokeRect(noteX, noteY, noteWidth, noteHeight);
        }

        // Center the text content on the sticky note
        const centerX = noteX + noteWidth / 2;
        const startY = noteY + 80;

        // Recipe title (centered)
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('📝 Recipe', centerX, startY);

        // Customer name and order (centered, black color)
        ctx.font = 'bold 14px Arial';
        ctx.fillStyle = '#2c3e50';
        ctx.fillText(`${game.currentCustomer.name}'s order:`, centerX, startY + 35);

        // Recipe content (centered)
        ctx.fillStyle = '#2c3e50';
        ctx.font = '11px Arial';
        let recipeY = startY + 60;
        let stepNum = 1;

        // Add recipe steps based on recipe order
        const order = game.currentCustomer.order;

        // Use recipe field for correct order
        if (order.recipe && order.recipe.length > 0) {
            order.recipe.forEach(ingredient => {
                const ingName = ingredientDB[ingredient].name;
                ctx.fillText(`${stepNum}. Add ${ingName.toLowerCase()}`, centerX, recipeY);
                recipeY += 18;
                stepNum++;
            });

        recipeY += 10;
        ctx.font = 'bold italic 14px Arial';
        ctx.fillStyle = '#666';
        ctx.fillText('Follow the order carefully!', centerX, recipeY);

        // Reset text alignment to default
        ctx.textAlign = 'left';
    }

    // Large cup in center - positioned between Complete and Reset buttons
    const cupX = 435, cupY = 250;
    const cupWidth = 150, cupHeight = 250;

    // Draw drink layers in cup first (behind the cup image)
    // Only draw layers if not in a special cup image sequence
    if (!shouldHideLayers()) {
        let layerY = cupY + 230;
        const layerHeight = 40;

        if (game.currentDrink.toppings.length > 0) {
            game.currentDrink.toppings.forEach((topping, i) => {
                ctx.fillStyle = ingredientDB[topping].color;
                ctx.fillRect(cupX + 10, layerY - i * 30, 130, 30);
            });
            layerY -= game.currentDrink.toppings.length * 30;
        }
        if (game.currentDrink.milk) {
            ctx.fillStyle = ingredientDB[game.currentDrink.milk].color;
            ctx.fillRect(cupX + 10, layerY - layerHeight, 130, layerHeight);
            layerY -= layerHeight;
        }
        if (game.currentDrink.base) {
            ctx.fillStyle = ingredientDB[game.currentDrink.base].color;
            ctx.fillRect(cupX + 10, layerY - layerHeight, 130, layerHeight);
        }
    }

    // Draw cup image on top - use dynamic cup image based on ingredients
    const currentCupImage = getCurrentCupImage();
    if (currentCupImage && currentCupImage.complete) {
        ctx.drawImage(currentCupImage, cupX, cupY, cupWidth, cupHeight);
    } else {
        // Fallback: draw simple cup if image not loaded
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(cupX, cupY, cupWidth, cupHeight);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.strokeRect(cupX, cupY, cupWidth, cupHeight);

        // Cup lid
        ctx.fillStyle = '#FF69B4';
        ctx.beginPath();
        ctx.arc(cupX + 75, cupY, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Straw
        ctx.strokeStyle = '#FF0000';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(cupX + 75, cupY - 80);
        ctx.lineTo(cupX + 75, cupY + 30);
        ctx.stroke();
    }

    // Ingredient options - categorized display
    const startX = 820, startY = 40;
    const boxWidth = 100, boxHeight = 100;
    const spacingX = 120, spacingY = 130;

    // Create a clipping region for ingredients to enable scrolling
    ctx.save();
    ctx.beginPath();
    ctx.rect(startX - 10, startY - 30, 400, 660);
    ctx.clip();

    let currentY = startY - game.ingredientScrollOffset;

    // Group ingredients by category
    const categories = {
        'Fruits': game.ingredients.filter(ing => ing.category === 'Fruits'),
        'Sauces': game.ingredients.filter(ing => ing.category === 'Sauces'),
        'Drinks': game.ingredients.filter(ing => ing.category === 'Drinks')
    };

    // Also add base and milk
    const bases = game.ingredients.filter(ing => ing.type === 'base');
    const milks = game.ingredients.filter(ing => ing.type === 'milk');
    const otherToppings = game.ingredients.filter(ing => (ing.type === 'topping' || ing.type === 'fruit') && !ing.category);

    // Draw each category
    Object.keys(categories).forEach(categoryName => {
        const items = categories[categoryName];
        if (items.length === 0) return;

        // Category title
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 16px Arial';
        ctx.fillText(categoryName, startX, currentY);
        currentY += 25;

        // Draw items in this category
        items.forEach((ing, i) => {
            const x = startX + (i % 3) * spacingX;
            const y = currentY + Math.floor(i / 3) * spacingY;

            // Ingredient box
            ctx.fillStyle = ing.color;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(x, y, boxWidth, boxHeight);
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, boxWidth, boxHeight);

            // Emoji or image
            if ((ing.id === 'strawberry' || ing.id === 'mango' || ing.id === 'lychee' || ing.id === 'passion-fruit' || ing.id === 'kiwi' || ing.id === 'blueberry' || ing.id === 'lemon' || ing.id === 'orange') && fruitBoxImages[ing.id] && fruitBoxImages[ing.id].complete) {
                // Draw fruit box image instead of emoji
                ctx.drawImage(fruitBoxImages[ing.id], x, y, boxWidth, boxHeight);
            } else if (ing.id === 'chocolate' && sauceImages[ing.id] && sauceImages[ing.id].complete) {
                // Draw sauce image instead of emoji
                ctx.drawImage(sauceImages[ing.id], x, y, boxWidth, boxHeight);
            } else if ((ing.id === 'black-tea' || ing.id === 'green-tea') && teaImages[ing.id] && teaImages[ing.id].complete) {
                // Draw tea image instead of emoji
                ctx.drawImage(teaImages[ing.id], x, y, boxWidth, boxHeight);
            } else if (emojiImages[ing.id] && emojiImages[ing.id].complete) {
                // Draw emoji image for jasmine-tea, cream, honey
                ctx.drawImage(emojiImages[ing.id], x, y, boxWidth, boxHeight);
            } else {
                // Draw emoji as fallback - centered in larger box
                ctx.font = '48px Arial';
                ctx.fillText(ing.emoji, x + 18, y + 62);
            }

            // Name - below the box
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 12px Arial';
            const nameWidth = ctx.measureText(ing.name).width;
            ctx.fillText(ing.name, x + (boxWidth - nameWidth) / 2, y + boxHeight + 15);
        });

        currentY += Math.ceil(items.length / 3) * spacingY + 15;
    });

    ctx.restore();

    // Complete button - moved left
    if (greenButtonLoaded) {
        ctx.drawImage(greenButtonImage, 300, 520, 200, 60);
    } else {
        // Fallback if image not loaded
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(300, 520, 200, 60);
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('✅ Complete', 330, 560);

    // Reset button - next to Complete
    if (redButtonLoaded) {
        ctx.drawImage(redButtonImage, 520, 520, 200, 60);
    } else {
        // Fallback if image not loaded
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(520, 520, 200, 60);
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('🔄 Reset', 570, 560);

    // Hand cursor hint
    ctx.fillStyle = '#666';
    ctx.font = '16px Arial';
    ctx.fillText('👆 Click ingredients to add', 430, 150);
}

            layerY -= layerHeight;
        }
        if (game.currentDrink.base) {
            ctx.fillStyle = ingredientDB[game.currentDrink.base].color;
            ctx.fillRect(cupX + 10, layerY - layerHeight, 130, layerHeight);
        }
    }

    // Draw cup image on top - use dynamic cup image based on ingredients
    const currentCupImage = getCurrentCupImage();
    if (currentCupImage && currentCupImage.complete) {
        ctx.drawImage(currentCupImage, cupX, cupY, cupWidth, cupHeight);
    } else {
        // Fallback: draw simple cup if image not loaded
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(cupX, cupY, cupWidth, cupHeight);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.strokeRect(cupX, cupY, cupWidth, cupHeight);

        // Cup lid
        ctx.fillStyle = '#FF69B4';
        ctx.beginPath();
        ctx.arc(cupX + 75, cupY, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Straw
        ctx.strokeStyle = '#FF0000';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(cupX + 75, cupY - 80);
        ctx.lineTo(cupX + 75, cupY + 30);
        ctx.stroke();
    }

    // Label
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('Your drink is ready!', boxX + 45, boxY + 40);

    // Continue button
    ctx.fillStyle = '#3498db';
    ctx.fillRect(500, 590, 200, 50);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('Continue →', 530, 622);
}

function updateCustomer() {
    // Animate customer walking to counter
    if (game.customerState === 'walking') {
        const speed = 3; // pixels per frame
        const distance = game.customerTargetX - game.customerX;

        if (Math.abs(distance) > speed) {
            // Still walking
            game.customerX += speed;

            // Update walking animation frame (switch every 10 frames)
            game.customerFrameCounter++;
            if (game.customerFrameCounter >= 10) {
                game.customerFrameCounter = 0;
                game.customerWalkFrame = game.customerWalkFrame === 0 ? 1 : 0;
            }
        } else {
            // Arrived at counter
            game.customerX = game.customerTargetX;
            game.customerState = 'arrived';

            // Show thought bubble when arrived (but only in serving mode, NOT in making mode)
            if (game.mode === 'serving') {
                const bubble = document.getElementById('thoughtBubble');
                bubble.style.display = 'block';
                bubble.style.left = (game.customerX + 150) + 'px';
                bubble.style.top = '20px';
                bubble.innerHTML = `<strong>${game.currentCustomer.name}:</strong><br>"${game.currentCustomer.order.text}"`;
            }
        }
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update customer animation
    updateCustomer();

    if (game.mode === 'serving') {
        // Draw serving mode
        drawBackground();
        drawCounter();
        drawCustomer();
        drawTeaMachine();
    } else if (game.mode === 'making') {
        // Draw making mode
        drawMakingMode();
    } else if (game.mode === 'finished') {
        // Draw finished drink display
        drawFinishedDrink();
    }

    game.animations = game.animations.filter(anim => { anim.draw(); return !anim.update(); });
    requestAnimationFrame(render);
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;

    if (game.mode === 'serving') {
        // Check if clicked on tea machine (moved left and up)
        // Machine is at x=150, y=150, width=300, height=420
        if (x >= 150 && x <= 450 && y >= 150 && y <= 570) {
            game.mode = 'making';
            game.ingredientScrollOffset = 0; // Reset scroll when entering making mode
            canvas.style.cursor = 'grab';
            // Hide thought bubble when entering making mode
            const bubble = document.getElementById('thoughtBubble');
            bubble.style.display = 'none';
            return;
        }

        // In serving mode, ingredients can only be clicked in making mode
        // No direct ingredient interaction in serving mode
    } else if (game.mode === 'making') {
        // Check if clicked on Complete button
        if (x >= 300 && x <= 500 && y >= 520 && y <= 580) {
            game.mode = 'finished';
            game.currentDrink.shaken = true;
            canvas.style.cursor = 'default';
            return;
        }

        // Check if clicked on Reset button
        if (x >= 520 && x <= 720 && y >= 520 && y <= 580) {
            resetDrink();
            return;
        }

        // Check if clicked on ingredients (categorized layout)
        const startX = 820, startY = 40;
        const boxWidth = 100, boxHeight = 100;
        const spacingX = 120, spacingY = 130;

        let currentY = startY - game.ingredientScrollOffset;

        // Group ingredients by category
        const categories = {
            'Fruits': game.ingredients.filter(ing => ing.category === 'Fruits'),
            'Sauces': game.ingredients.filter(ing => ing.category === 'Sauces'),
            'Drinks': game.ingredients.filter(ing => ing.category === 'Drinks')
        };

        // Check each category
        Object.keys(categories).forEach(categoryName => {
            const items = categories[categoryName];
            if (items.length === 0) return;

            currentY += 25; // Skip category title

            items.forEach((ing, i) => {
                const ingX = startX + (i % 3) * spacingX;
                const ingY = currentY + Math.floor(i / 3) * spacingY;

                if (x >= ingX && x <= ingX + boxWidth && y >= ingY && y <= ingY + boxHeight) {
                    const ingData = ingredientDB[ing.id];
                    // Add to drink - increased limit to 5
                    if (ingData.type === 'base' && !game.currentDrink.base) {
                        game.currentDrink.base = ing.id;
                    } else if (ingData.type === 'milk' && !game.currentDrink.milk) {
                        game.currentDrink.milk = ing.id;
                    } else if (ingData.type === 'fruit') {
                        // For fruits: remove all OTHER fruits (keeping same fruit), then add the new one
                        const otherFruits = game.currentDrink.toppings.filter(t => ingredientDB[t].type === 'fruit' && t !== ing.id);
                        if (otherFruits.length > 0) {
                            // If there are other fruits, remove all fruits first
                            game.currentDrink.toppings = game.currentDrink.toppings.filter(t => ingredientDB[t].type !== 'fruit');
                        }
                        // Add the new fruit (allow multiple of the same fruit)
                        game.currentDrink.toppings.push(ing.id);
                    } else if (ingData.type === 'topping') {
                        // No limit on toppings - can add as many as needed
                        game.currentDrink.toppings.push(ing.id);
                    }
                }
            });

            currentY += Math.ceil(items.length / 3) * spacingY + 15;
        });
    } else if (game.mode === 'finished') {
        // Check if clicked on continue button
        if (x >= 500 && x <= 700 && y >= 590 && y <= 640) {
            // Immediately return to serving mode
            game.mode = 'serving';
            // Automatically serve drink to customer and show receipt
            serveDrink();
            canvas.style.cursor = 'default';
            return;
        }
    }
});

// Mouse wheel event for scrolling ingredients in making mode
canvas.addEventListener('wheel', (e) => {
    if (game.mode === 'making') {
        e.preventDefault();

        // Scroll amount
        const scrollAmount = e.deltaY > 0 ? 30 : -30;
        game.ingredientScrollOffset += scrollAmount;

        // Limit scroll bounds (prevent scrolling too far up or down)
        const maxScroll = 400; // Maximum scroll down
        const minScroll = 0; // Minimum scroll (top)

        game.ingredientScrollOffset = Math.max(minScroll, Math.min(maxScroll, game.ingredientScrollOffset));
    }
}, { passive: false });

function serveDrink() {
    if (!game.currentCustomer) return;
    const order = game.currentCustomer.order, drink = game.currentDrink;
    let score = 0, total = 0;
    if (order.base) { total++; if (drink.base === order.base) score++; }
    if (order.milk) { total++; if (drink.milk === order.milk) score++; }
    if (order.toppings && order.toppings.length > 0) {
        total += order.toppings.length;
        order.toppings.forEach(topping => { if (drink.toppings.includes(topping)) score++; });
    }
    if (drink.shaken) { score += 0.5; total += 0.5; }
    const finalScore = total > 0 ? score / total : 0;

    // Calculate earnings - if order doesn't match customer's request, no money!
    let earnings = 0;
    if (finalScore >= 0.5) {
        const basePrice = 4.5, multiplier = 0.7 + (finalScore * 1.3), tip = finalScore >= 0.9 ? basePrice * 0.5 : finalScore >= 0.7 ? basePrice * 0.2 : 0;
        earnings = parseFloat((basePrice * multiplier + tip).toFixed(2));
        game.money += earnings;
    }

    game.served++;
    game.reputation += finalScore >= 0.8 ? 10 : finalScore >= 0.6 ? 5 : finalScore >= 0.5 ? 2 : -5;

    const modal = document.getElementById('resultModal'), emoji = document.getElementById('scoreEmoji');
    emoji.textContent = finalScore >= 0.9 ? '🤩' : finalScore >= 0.7 ? '😊' : finalScore >= 0.5 ? '🙂' : '😡';
    document.getElementById('feedbackText').textContent = finalScore >= 0.9 ? 'PERFECT! Exactly what I wanted!' : finalScore >= 0.7 ? 'Great job! This is delicious!' : finalScore >= 0.5 ? 'Pretty good, thanks!' : 'This is NOT what I ordered! 😡';
    document.getElementById('earningsText').textContent = earnings > 0 ? `Earned: $${earnings} (${(finalScore * 100).toFixed(0)}% match)` : `😡 No payment - wrong order! (${(finalScore * 100).toFixed(0)}% match)`;
    modal.classList.add('active');
    updateUI();
    setTimeout(() => {
        modal.classList.remove('active');
        resetDrink();
        spawnCustomer();
    }, 3000);
}

function resetDrink() { game.currentDrink = { base: null, milk: null, toppings: [], shaken: false }; }
function closeResultModal() { document.getElementById('resultModal').classList.remove('active'); }
function spawnCustomer() {
    // Select customer in order (rotating through the list)
    game.currentCustomer = customers[game.customerIndex];
    game.customerIndex = (game.customerIndex + 1) % customers.length;

    // Start customer off-screen to the left
    game.customerX = -100;
    game.customerY = 220;
    game.customerState = 'walking';

    // Reset walking animation frame
    game.customerWalkFrame = 0;
    game.customerFrameCounter = 0;

    // Hide thought bubble initially - it will show when customer arrives
    const bubble = document.getElementById('thoughtBubble');
    bubble.style.display = 'none';
}
function updateUI() {
    document.getElementById('money').textContent = `$${game.money.toFixed(2)}`;
    document.getElementById('reputation').textContent = game.reputation;
    document.getElementById('day').textContent = game.day;
    document.getElementById('served').textContent = game.served;
}

spawnCustomer(); updateUI(); render();
    </script>
</body>
